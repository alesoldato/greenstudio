  </head>
  <body>
    <div class="preloader"><img src="assets/preloader-mark.svg" alt=""></div>
    <main id="top">
      <div class="hero-stage">
      <section class="hero" aria-label="Green yoga studio">
        <div class="hero__background" aria-hidden="true">
          <video class="hero__video" data-src="assets/hero-video-scrub-720.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
        </div>
        <div class="hero__shade" aria-hidden="true"></div>

        <header class="site-header reveal reveal--header">
          <a class="brand" href="#top" aria-label="Green Studio home">
            <span class="brand__desktop" aria-hidden="true">
              <img class="brand__mark" src="assets/logo-mark.svg" alt="">
              <img class="brand__word" src="assets/logo-word.svg" alt="">
              <img class="brand__studio" src="assets/logo-studio.svg" alt="">
            </span>
            <span class="brand__mobile" aria-hidden="true">
              <img class="brand__mark" src="assets/logo-mobile-mark.svg" alt="">
              <img class="brand__word" src="assets/logo-mobile-word.svg" alt="">
              <img class="brand__studio" src="assets/logo-mobile-studio.svg" alt="">
            </span>
          </a>
          <nav class="site-nav" aria-label="Main navigation">
            <a href="#about-studio"><span>About studio</span><span class="site-nav__clone" aria-hidden="true">About studio</span></a>
            <a href="#classes"><span>Classes</span><span class="site-nav__clone" aria-hidden="true">Classes</span></a>
            <a href="#video-tour"><span>Video-tour</span><span class="site-nav__clone" aria-hidden="true">Video-tour</span></a>
            <a href="#membership"><span>Membership</span><span class="site-nav__clone" aria-hidden="true">Membership</span></a>
            <a href="#contact"><span>Contact</span><span class="site-nav__clone" aria-hidden="true">Contact</span></a>
          </nav>
          <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><img src="assets/menu.svg" alt=""></button>
        </header>

        <div class="hero__bottom">
          <div class="hero__copy">
            <h1><span class="heading-line">Yoga</span><span class="heading-line">classes for</span><span class="heading-line">everyone</span></h1>
            <div class="hero__actions">
              <a class="cta reveal reveal--cta" href="#classes">
                <span class="cta__arrow cta__arrow--enter" aria-hidden="true"><img class="arrow-desktop" src="assets/arrow-desktop.svg" alt=""><img class="arrow-mobile" src="assets/arrow-mobile.svg" alt=""></span>
                <span class="cta__text">Explore Classes</span>
                <span class="cta__arrow cta__arrow--exit" aria-hidden="true"><img class="arrow-desktop" src="assets/arrow-desktop.svg" alt=""><img class="arrow-mobile" src="assets/arrow-mobile.svg" alt=""></span>
              </a>
              <p class="reveal reveal--subheading">Take your place in a friendly neighborhood yoga studio for every body, every level, and every kind of day</p>
            </div>
          </div>
          <button class="tour-card reveal reveal--tour" type="button" aria-label="Watch a short video-tour to our studio">
            <img class="tour-card__image" src="assets/videotour-figma.jpg" alt="Yoga instructor sitting on a mat">
            <span class="tour-card__shade"></span>
            <span class="tour-card__caption"><span class="tour-card__play"><img src="assets/play.svg" alt=""></span><span>Watch a short video-tour to our studio</span></span>
          </button>
        </div>
      </section>
      </div>
    </main>
    <dialog class="tour-dialog" aria-label="Green Studio video-tour">
      <button class="tour-dialog__close" type="button" aria-label="Close video">×</button>
      <video controls playsinline preload="none"></video>
    </dialog>
    <script src="script.js?v=real-video-sequence" defer></script>
  </body>
</html>
